 const r=on?await sb.from('follows').delete().match({follower_id:me.id,followee_id:u}):await sb.from('follows').insert({followee_id:u});if(r.error){toast('Couldn’t save that');load()}}
async function share(p){const u=location.href;try{if(navigator.share)await navigator.share({title:'Loopy',text:p.caption||'Watch this on Loopy',url:u});else{await navigator.clipboard.writeText(u);toast('Link copied')}}catch(e){}}
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'Sound off':'Sound on';slides.forEach(o=>{if(o.vid)o.vid.muted=muted})};
function setMode(m){mode=m;$('mAll').classList.toggle('on',m==='all');$('mFol').classList.toggle('on',m==='fol');sig='';tab('home');build();refresh();names();feed.scrollTo(0,0)}
$('mAll').onclick=()=>setMode('all');$('mFol').onclick=()=>{if(!need())return;setMode('fol')};

// ---- comments
function renderComs(){const l=$('cml');l.innerHTML='';const cs=coms.filter(c=>c.post_id===cmPid);$('cmT').textContent=cs.length+' comment'+(cs.length===1?'':'s');
 if(!cs.length){const n=el('p',null,'No comments yet. Start the conversation.');n.style.cssText='color:#6b6480;text-align:center;padding:30px 0';l.append(n);return}
 cs.forEach(c=>{const q=profs[c.user_id],r=el('div','cr'),a=el('span','av'),t=el('div');setAv(a,q);t.append(el('small',null,q?'@'+q.username:'someone'),el('span',null,c.text));r.append(a,t);l.append(r)});l.scrollTop=l.scrollHeight}
$('cmX').onclick=()=>{hide('cm');cmPid=null};
$('cmS').onclick=async()=>{const t=$('cmIn').value.trim();if(!t||!cmPid)return;if(!needProf()){hide('cm');return}$('cmIn').value='';
 const r=await sb.from('comments').insert({post_id:cmPid,text:t});if(r.error)toast('Couldn’t post that comment');await load()};
$('cmIn').onkeydown=e=>{if(e.key==='Enter')$('cmS').click()};

// ---- accounts
$('auT').onclick=()=>{authMode=authMode==='up'?'in':'up';$('auH').textContent=authMode==='up'?'Create your account':'Log in';$('auT').textContent=authMode==='up'?'I have an account':'Create an account'};
$('auX').onclick=()=>hide('auth');
$('auGo').onclick=async()=>{const email=$('auE').value.trim(),password=$('auP').value;$('auN').textContent='';
 if(!email||password.length<6){$('auN').textContent='Enter your email and a password of at least 6 characters.';return}
 const r=authMode==='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error){$('auN').textContent=r.error.message;return}
 if(authMode==='up'&&!r.data.session){$('auN').textContent='Check your email to confirm your account, then log in.';return}hide('auth')};
SW.forEach(c=>{const b=el('button','sw');b.style.background=c;b.dataset.c=c;b.setAttribute('aria-label','Colour '+c);b.onclick=()=>{swatch=c;markSw();if(!picUrl)setAv($('pPrev'),{display_name:$('pDn').value||'?',color:c})};$('pSw').append(b)});
function markSw(){[...$('pSw').children].forEach(b=>b.classList.toggle('on',b.dataset.c===swatch))}
function openProf(){const q=mp();$('pDn').value=q?q.display_name:'';$('pUn').value=q?q.username:'';$('pBio').value=q?q.bio||'':'';swatch=q?q.color:SW[0];picUrl=q&&q.pic||'';markSw();
 setAv($('pPrev'),{display_name:$('pDn').value||'?',color:swatch,pic:picUrl});$('pT').textContent=q?'Edit profile':'Create your account';$('pN').textContent='';show('prSheet')}
$('pX').onclick=()=>hide('prSheet');$('pPicB').onclick=()=>$('pPic').click();
$('pPic').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;$('pN').textContent='Uploading…';try{picUrl=await upload(f);setAv($('pPrev'),{display_name:$('pDn').value||'?',color:swatch,pic:picUrl});$('pN').textContent='Photo ready. Tap Save.'}catch(err){$('pN').textContent='Upload failed: '+(err.message||'try again')}};
$('pSave').onclick=async()=>{const dn=$('pDn').value.trim(),un=$('pUn').value.trim().toLowerCase(),bio=$('pBio').value.trim();
 if(!dn){$('pN').textContent='Please enter your name.';return}if(!/^[a-z0-9_.]{3,20}$/.test(un)){$('pN').textContent='Usernames are 3 to 20 letters, numbers, _ or .';return}
 const row={username:un,display_name:dn,bio,color:swatch,pic:picUrl||null},ex=mp();
 const r=ex?await sb.from('profiles').update(row).eq('id',me.id):await sb.from('profiles').insert({id:me.id,...row});
 if(r.error){$('pN').textContent=r.error.code==='23505'?'That username is taken.':r.error.message;return}hide('prSheet');toast('Profile saved');await load()};

// ---- posting
async function prep(f){let t=(f.type||'').split(';')[0];
 if(t.startsWith('image/')&&!['image/png','image/jpeg','image/gif','image/webp'].includes(t)){const bm=await createImageBitmap(f),s=Math.min(1,2000/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  const b=await new Promise((ok,no)=>c.toBlob(x=>x?ok(x):no(new Error('convert')),'image/jpeg',.9));return{b,t:'image/jpeg',e:'jpg'}}
 if(t==='video/x-m4v')t='video/mp4';if(!t&&/\.mov$/i.test(f.name))t='video/quicktime';
 return{b:f,t,e:((f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin').slice(0,5)}}
async function upload(f){const{b,t,e}=await prep(f),path=me.id+'/'+Date.now()+'.'+e,r=await sb.storage.from('media').upload(path,b,{contentType:t});if(r.error)throw r.error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl}
function resetMk(){pending=null;fx='';$('mkPrev').innerHTML='';$('mkOv').hidden=true;$('mkS2').hidden=true;$('mkS1').hidden=false;$('mkTx').value='';$('mkD').value='';$('mkN').textContent='Photos and videos up to 50 MB.';$('mkFx').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===''))}
$('plus').onclick=()=>{if(!needProf())return;resetMk();show('mk')};
$('mkX').onclick=$('mkX2').onclick=()=>hide('mk');$('mkBack').onclick=resetMk;
$('mkCam').onclick=()=>$('inCam').click();$('mkLib').onclick=()=>$('inLib').click();
$('inCam').onchange=$('inLib').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>50*1024*1024){$('mkN').textContent='That file is over 50 MB. Try a shorter clip.';return}
 pending=f;const im=isImg(f),m=document.createElement(im?'img':'video');m.src=URL.createObjectURL(f);if(!im){m.muted=true;m.loop=true;m.autoplay=true;m.playsInline=true;m.controls=true}
 $('mkPrev').innerHTML='';$('mkPrev').append(m);$('mkS1').hidden=true;$('mkS2').hidden=false;$('mkN').textContent=''};
const isImg=f=>(f.type||'').startsWith('image')||/\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name);
$('mkFx').onclick=e=>{const b=e.target.closest('button');if(!b)return;fx=b.dataset.f;const m=$('mkPrev').firstChild;if(m)m.style.filter=FX[fx]||'';$('mkFx').querySelectorAll('button').forEach(q=>q.classList.toggle('on',q===b))};
$('mkTx').oninput=()=>{const t=$('mkTx').value.trim();$('mkOv').textContent=t;$('mkOv').hidden=!t};
$('mkGo').onclick=async()=>{if(!pending)return;$('mkGo').disabled=true;$('mkN').textContent='Posting…';
 try{const url=await upload(pending),row={kind:isImg(pending)?'photo':'video',url,caption:$('mkD').value.trim()},t=$('mkTx').value.trim();
  if(fx)row.fx=fx;if(t){row.tt=t;row.tc='#ffffff';row.tpx=50;row.tpy=45}
  const r=await sb.from('posts').insert(row);if(r.error)throw r.error;hide('mk');toast('Posted!');sig='';await load();feed.scrollTo(0,0)}
 catch(e){$('mkN').textContent='Couldn’t post: '+(e.message||'try again')}$('mkGo').disabled=false};

// ---- profile page, tabs, search
function tab(n){const pf=n==='prof';$('prof').hidden=!pf;document.body.classList.toggle('inprof',pf);document.querySelectorAll('.nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===(pf?'me':'home')));
 if(active&&active.vid){pf?active.vid.pause():active.vid.play().catch(()=>{})}if(!pf)viewing=null}
function showProfile(u){if(!u)return;viewing=u;const q=profs[u]||{display_name:'Someone',username:'someone',bio:'',color:'#b3a9c9'},ps=posts.filter(p=>p.user_id===u),own=!!me&&u===me.id,P=$('prof');P.innerHTML='';
 const h=el('div','ph'),av=el('span','av');setAv(av,q);const lk=ps.reduce((a,p)=>a+lc(p.id),0);
 h.append(av,el('h2',null,q.display_name),el('p','bio','@'+q.username+(q.bio?' · '+q.bio:'')));
 const st=el('div','stats');[[ps.length,'Posts'],[fc(u),'Followers'],[follows.filter(f=>f.follower_id===u).length,'Following'],[lk,'Likes']].forEach(([n,l])=>{const d=el('div');d.append(el('b',null,String(n)),el('span',null,l));st.append(d)});h.append(st);
 if(own){const e=el('button','btn alt','Edit profile');e.onclick=openProf;const o=el('button','btn alt','Log out');o.onclick=async()=>{await sb.auth.signOut();tab('home');toast('Logged out')};const r=el('div','row');r.style.justifyContent='center';r.append(e,o);h.append(r)}
 else{const on=isFol(u),f=el('button','btn'+(on?' alt':''),on?'Following':'Follow');f.onclick=()=>toggleFollow(u);h.append(f)}
 P.append(h);if(!own)ptab='posts';
 if(own){const tb=el('div','ptabs');[['posts',GRID,'Your posts'],['liked',HEART,'Videos you liked']].forEach(([k,ic,lb])=>{const b=el('button',ptab===k?'on':'');b.setAttribute('aria-label',lb);b.innerHTML=ic;b.onclick=()=>{ptab=k;showProfile(u)};tb.append(b)});P.append(tb)}
 const list=own&&ptab==='liked'?posts.filter(p=>isLk(p.id)):ps,g=el('div','grid');
 list.forEach(p=>{const t=el('button','tile'),vd=p.kind==='video',m=document.createElement(vd?'video':'img');t.setAttribute('aria-label',p.caption||'Open post');m.src=vd?p.url+'#t=0.1':p.url;if(vd){m.muted=true;m.preload='metadata';m.playsInline=true}if(p.fx&&FX[p.fx])m.style.filter=FX[p.fx];t.append(m);
  t.onclick=()=>{if(mode!=='all')setMode('all');tab('home');const o=slides.find(z=>z.p.id===p.id);if(o)o.el.scrollIntoView()};g.append(t)});
 if(!list.length){const n=el('p','note',own&&ptab==='liked'?'Videos you like will show up here.':own?'Tap + to post your first photo or video.':'No posts yet.');n.style.cssText='padding:24px;grid-column:1/-1;text-align:center;color:#5d5670';g.append(n)}
 P.append(g);tab('prof')}
document.querySelectorAll('.nav [data-t]').forEach(b=>b.onclick=()=>{if(b.dataset.t==='home'){tab('home');return}if(!need())return;showProfile(me.id);if(!mp())openProf()});
function search(){const q=$('q').value.trim().toLowerCase().replace(/^@/,''),r=$('res');r.innerHTML='';
 const L=Object.values(profs).filter(v=>!q||v.username.includes(q)||v.display_name.toLowerCase().includes(q)||(v.bio||'').toLowerCase().includes(q)).sort((a,b)=>fc(b.id)-fc(a.id)).slice(0,30);
 if(!L.length){const n=el('p','note',q?'No accounts found.':'No accounts yet.');n.style.padding='20px 4px';r.append(n);return}
 L.forEach(v=>{const b=el('button','ur'),a=el('span','av'),t=el('span');setAv(a,v);t.append(el('b',null,v.display_name),el('small',null,'@'+v.username+' · '+fc(v.id)+' followers'));b.append(a,t);b.onclick=()=>{$('srch').hidden=true;showProfile(v.id)};r.append(b)})}
$('srB').onclick=()=>{$('srch').hidden=false;$('q').value='';search();$('q').focus()};$('qx').onclick=()=>{$('srch').hidden=true};$('q').oninput=search;
addEventListener('keydown',e=>{if(e.key==='Escape')$('srch').hidden=true});
</script>
